services:
  - type: web
    name: smart-campus-timetable
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: oregon
    envVars:
      - key: PORT
        value: 10000
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DB_ENGINE
        value: sqlite
      - key: SECRET_KEY
        generateValue: true
      - key: GROQ_API_KEY
        sync: false
